<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Nongfsq profile console</title>
  <desc id="desc">Independent product systems architect. Typed platforms, data planes, security boundaries, observability, and AI-assisted delivery.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081311"/>
      <stop offset="0.48" stop-color="#0d1718"/>
      <stop offset="1" stop-color="#15110c"/>
    </linearGradient>
    <radialGradient id="tealGlow" cx="68%" cy="42%" r="52%">
      <stop offset="0" stop-color="#16a394" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#0f766e" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="88%" cy="76%" r="38%">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e7f8f3" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .panel { fill: rgba(255,255,255,0.045); stroke: rgba(210,255,246,0.14); stroke-width: 1; }
      .panel-strong { fill: rgba(7,20,18,0.78); stroke: rgba(94,234,212,0.28); stroke-width: 1; }
      .hairline { stroke: rgba(206,255,246,0.18); stroke-width: 1; fill: none; }
      .flow { stroke: #5eead4; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
      .flow-amber { stroke: #f59e0b; stroke-opacity: 0.5; stroke-width: 1.4; fill: none; }
      .label { fill: #8fb8b0; font-family: "Segoe UI", "Aptos", sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 2.8px; }
      .mono { fill: #7ea49d; font-family: "Cascadia Mono", "Consolas", monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.5px; }
      .small { fill: #9fbab4; font-family: "Segoe UI", "Aptos", sans-serif; font-size: 13px; font-weight: 500; }
      .body { fill: #c5d7d2; font-family: "Segoe UI", "Aptos", sans-serif; font-size: 22px; font-weight: 500; }
      .title { fill: #f4fbf8; font-family: "Segoe UI", "Aptos Display", sans-serif; font-size: 76px; font-weight: 700; letter-spacing: -2.4px; }
      .subtitle { fill: #cce5de; font-family: "Segoe UI", "Aptos", sans-serif; font-size: 22px; font-weight: 650; letter-spacing: 0.2px; }
      .node-title { fill: #eefaf7; font-family: "Segoe UI", "Aptos", sans-serif; font-size: 14px; font-weight: 650; letter-spacing: 0.6px; }
      .node-sub { fill: #83a8a1; font-family: "Cascadia Mono", "Consolas", monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.4px; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#surface)"/>
  <rect width="1200" height="420" rx="28" fill="url(#tealGlow)"/>
  <rect width="1200" height="420" rx="28" fill="url(#amberGlow)"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="url(#grid)" opacity="0.9"/>
  <rect x="1" y="1" width="1198" height="418" rx="27" fill="none" stroke="#d8fff6" stroke-opacity="0.13"/>

  <g transform="translate(64 54)">
    <text class="label" x="0" y="0">SYSTEMS PRACTICE / PRIVATE CORE / PUBLIC ARTIFACTS</text>
    <text class="title" x="0" y="94">Nongfsq</text>
    <text class="subtitle" x="4" y="134">Independent Product Systems Architect</text>
    <text class="body" x="4" y="190">Product strategy, typed platforms, and data planes.</text>
    <text class="body" x="4" y="222">Security, observability, and AI-assisted delivery as one system.</text>

    <g transform="translate(4 272)">
      <rect class="panel" x="0" y="0" width="146" height="42" rx="21"/>
      <text class="mono" x="20" y="27">FULL-STACK</text>
      <rect class="panel" x="158" y="0" width="118" height="42" rx="21"/>
      <text class="mono" x="178" y="27">DATA</text>
      <rect class="panel" x="288" y="0" width="118" height="42" rx="21"/>
      <text class="mono" x="309" y="27">DEVOPS</text>
      <rect class="panel" x="418" y="0" width="174" height="42" rx="21"/>
      <text class="mono" x="440" y="27">AI DELIVERY</text>
    </g>
  </g>

  <g transform="translate(672 60)" filter="url(#softShadow)">
    <rect class="panel-strong" x="0" y="0" width="456" height="300" rx="24"/>
    <path class="hairline" d="M 34 64 H 422"/>
    <path class="hairline" d="M 34 232 H 422"/>
    <text class="label" x="34" y="38">ARCHITECTURE MAP</text>
    <text class="mono" x="330" y="38">2026</text>

    <g transform="translate(44 86)">
      <rect class="panel" x="0" y="0" width="118" height="50" rx="14"/>
      <text class="node-title" x="18" y="22">Product</text>
      <text class="node-sub" x="18" y="39">domain model</text>

      <rect class="panel" x="0" y="118" width="118" height="50" rx="14"/>
      <text class="node-title" x="18" y="140">Interfaces</text>
      <text class="node-sub" x="18" y="157">public/admin</text>

      <rect class="panel" x="166" y="0" width="118" height="50" rx="14"/>
      <text class="node-title" x="184" y="22">Typed API</text>
      <text class="node-sub" x="184" y="39">OpenAPI/GraphQL</text>

      <rect class="panel" x="166" y="118" width="118" height="50" rx="14"/>
      <text class="node-title" x="184" y="140">Data Plane</text>
      <text class="node-sub" x="184" y="157">cache/search</text>

      <rect class="panel" x="320" y="0" width="92" height="50" rx="14"/>
      <text class="node-title" x="338" y="22">Security</text>
      <text class="node-sub" x="338" y="39">RBAC/audit</text>

      <rect class="panel" x="320" y="118" width="92" height="50" rx="14"/>
      <text class="node-title" x="338" y="140">Ops</text>
      <text class="node-sub" x="338" y="157">observe/QA</text>

      <path class="flow" d="M 118 25 C 140 25 144 25 166 25"/>
      <path class="flow" d="M 118 143 C 140 143 144 143 166 143"/>
      <path class="flow" d="M 225 50 C 225 78 225 90 225 118"/>
      <path class="flow" d="M 284 25 C 304 25 306 25 320 25"/>
      <path class="flow-amber" d="M 284 143 C 304 143 306 143 320 143"/>
      <path class="flow-amber" d="M 366 50 C 366 78 366 90 366 118"/>

      <circle cx="225" cy="84" r="5" fill="#5eead4"/>
      <circle cx="366" cy="84" r="5" fill="#f59e0b"/>
    </g>

    <g transform="translate(34 274)">
      <text class="small" x="0" y="0">Verification:</text>
      <text class="mono" x="94" y="0">PM -> contracts -> tests -> diagnostics</text>
    </g>
  </g>
</svg>
