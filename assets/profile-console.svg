<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nongfsq profile console</title>
  <desc id="desc">A dark editorial GitHub profile banner with search and repository dashboard motifs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06111F"/>
      <stop offset="0.52" stop-color="#0D2628"/>
      <stop offset="1" stop-color="#2A150D"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(972 86) rotate(135) scale(420 260)">
      <stop stop-color="#5EEAD4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 302) rotate(-20) scale(360 220)">
      <stop stop-color="#60A5FA" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="34" fill="url(#glowA)"/>
  <rect width="1200" height="360" rx="34" fill="url(#glowB)"/>

  <g opacity="0.12">
    <path d="M-60 92H1260" stroke="#E5E7EB"/>
    <path d="M-60 184H1260" stroke="#E5E7EB"/>
    <path d="M-60 276H1260" stroke="#E5E7EB"/>
    <path d="M176 -60V420" stroke="#E5E7EB"/>
    <path d="M416 -60V420" stroke="#E5E7EB"/>
    <path d="M656 -60V420" stroke="#E5E7EB"/>
    <path d="M896 -60V420" stroke="#E5E7EB"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="712" y="58" width="372" height="244" rx="26" fill="#07111D" fill-opacity="0.72" stroke="#D1FAE5" stroke-opacity="0.18"/>
    <rect x="742" y="88" width="238" height="16" rx="8" fill="#E5E7EB" fill-opacity="0.18"/>
    <rect x="742" y="128" width="282" height="40" rx="14" fill="#0F766E" fill-opacity="0.32" stroke="#5EEAD4" stroke-opacity="0.42"/>
    <rect x="742" y="188" width="128" height="14" rx="7" fill="#60A5FA" fill-opacity="0.55"/>
    <rect x="742" y="218" width="250" height="14" rx="7" fill="#E5E7EB" fill-opacity="0.16"/>
    <rect x="742" y="248" width="198" height="14" rx="7" fill="#E5E7EB" fill-opacity="0.12"/>
    <circle cx="1038" cy="148" r="18" fill="#F97316" fill-opacity="0.75"/>
  </g>

  <g>
    <text x="80" y="112" fill="#CCFBF1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">GITHUB COMMAND CENTER</text>
    <text x="78" y="178" fill="#F8FAFC" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">Kimo / Nongfsq</text>
    <text x="82" y="222" fill="#CBD5E1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="23" font-weight="500">private products, automation tools, readable systems</text>
  </g>

  <g font-family="Cascadia Mono, Consolas, monospace" font-size="16" font-weight="600">
    <rect x="82" y="260" width="124" height="34" rx="17" fill="#F8FAFC" fill-opacity="0.10" stroke="#F8FAFC" stroke-opacity="0.12"/>
    <text x="104" y="283" fill="#E2E8F0">TypeScript</text>
    <rect x="220" y="260" width="94" height="34" rx="17" fill="#F8FAFC" fill-opacity="0.10" stroke="#F8FAFC" stroke-opacity="0.12"/>
    <text x="242" y="283" fill="#E2E8F0">Python</text>
    <rect x="328" y="260" width="76" height="34" rx="17" fill="#F8FAFC" fill-opacity="0.10" stroke="#F8FAFC" stroke-opacity="0.12"/>
    <text x="350" y="283" fill="#E2E8F0">Rust</text>
    <rect x="418" y="260" width="78" height="34" rx="17" fill="#F8FAFC" fill-opacity="0.10" stroke="#F8FAFC" stroke-opacity="0.12"/>
    <text x="440" y="283" fill="#E2E8F0">Shell</text>
  </g>
</svg>
